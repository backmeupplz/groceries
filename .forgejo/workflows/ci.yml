name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # Our pushes and PRs run on the Mac runners; outsider PRs (bridged in by the `github` bot) never touch the Mac
    # and run on Linux.
    runs-on: ${{ (github.event_name != 'pull_request' || contains(fromJSON('["backmeupplz","renovate","claude"]'), github.event.pull_request.user.login)) && 'macos-latest' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # node:sqlite needs Node >= 22.5; the Mac has Homebrew's Node, Linux gets the Dockerfile's major
      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: 24
      - name: Syntax and tests
        run: |
          node --version
          node --check server.js
          node test.js
