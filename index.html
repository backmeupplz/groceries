<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#111">
<title>Groceries</title>
<style>
* { box-sizing: border-box; margin: 0; font: inherit; color: inherit }
body { background: #111; color: #ddd; font: 17px/1.4 system-ui, sans-serif; max-width: 40rem; margin: auto; -webkit-tap-highlight-color: transparent }
button { background: none; border: 0; cursor: pointer; touch-action: manipulation }
[hidden] { display: none !important }
.off { content-visibility: hidden; height: 0; border: 0 !important } /* inactive list: keeps its layout, so switching back is instant */
input { width: 100%; background: #1b1b1b; border: 1px solid #333; border-radius: 8px; padding: .7rem .9rem; outline: 0 }
input:focus { border-color: #555 }
#auth, #app, #bad { display: none }
.login #auth { display: flex } .app #app, .bad #bad { display: block }
#auth { flex-direction: column; gap: .75rem; padding: 20vh 1rem 0 }
#auth button, #nu > button { background: #ddd; color: #111; border-radius: 8px; padding: .7rem }
h1, h2 { font-weight: 600; font-size: 1.2rem }
nav { display: flex; align-items: center; gap: .25rem; margin-bottom: .6rem }
nav h1 { flex: 1; padding-left: .2rem }
nav button { display: flex; padding: .4rem; color: #888 }
nav button:hover { color: #ddd }
svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round }
dialog { background: #1b1b1b; border: 1px solid #333; border-radius: 12px; padding: 0; width: min(22rem, calc(100% - 2rem)); margin: auto }
dialog::backdrop { background: #000a }
dialog input { background: #111 }
#uw, #nu { display: grid; gap: .6rem }
#uw { padding: 1rem }
#ul { list-style: none; padding: 0; margin-bottom: .4rem }
#ul li { display: flex; justify-content: space-between; align-items: center; min-height: 2.5rem; border-bottom: 1px solid #2a2a2a }
#ul li span { color: #666 }
#ul button { display: flex; padding: .4rem; color: #888 }
#ul svg { width: 18px; height: 18px }
#bad { color: #e66 }
header { position: sticky; top: 0; background: #111; padding: .75rem; z-index: 1 }
#tabs { display: flex; gap: .4rem; overflow-x: auto; scrollbar-width: none; margin-bottom: .6rem }
#sug button, #tabs button { flex: none; border: 1px solid #333; border-radius: 99px; padding: .3rem .8rem; margin: .5rem .4rem 0 0 }
#tabs button { margin: 0 }
#tabs [aria-current=true] { background: #ddd; color: #111; border-color: #ddd }
.todo button, .done button { display: block; width: 100%; text-align: left; padding: .75rem 1rem; border-bottom: 1px solid #1e1e1e; content-visibility: auto; contain-intrinsic-size: auto 2.9rem; overflow-wrap: anywhere }
.done button { color: #555; text-decoration: line-through }
.done:not(:empty) { border-top: 1px solid #333 }
</style>
<body>
<form id="auth" method="post" action="/login">
  <h1>Groceries</h1>
  <p id="bad">Wrong login or password</p>
  <input name="u" placeholder="login" autocomplete="username" autocapitalize="off" required>
  <input name="p" type="password" placeholder="password" autocomplete="current-password" required>
  <button>Go</button>
</form>
<main id="app">
  <header>
    <nav>
      <h1>Groceries</h1>
      <button id="lb" type="button" title="Delete this list" aria-label="Delete this list"><svg viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
      <button id="ub" type="button" title="Users" aria-label="Users"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg></button>
      <form id="lo" method="post" action="/logout"><button title="Log out" aria-label="Log out"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></button></form>
    </nav>
    <div id="tabs"><button id="nl" type="button" title="New list" aria-label="New list">+</button></div>
    <form id="add"><input id="inp" placeholder="Add item" autocomplete="off" enterkeyhint="done"></form><div id="sug"></div></header>
  <div id="board"></div>
  <dialog id="users"><div id="uw">
    <h2>Users</h2>
    <ul id="ul"></ul>
    <form id="nu">
      <input name="u" placeholder="login" autocomplete="off" autocapitalize="off" required>
      <input name="p" type="password" placeholder="password (8+ chars)" autocomplete="new-password" minlength="8" required>
      <button>Add user</button>
    </form>
  </div></dialog>
</main>
<script>
if (document.body.classList.contains('app')) {
  const lists = new Map // id -> { tab, todo, done, items: Map(lowercase name -> { el, done, t }) }
  let cur, rev = 0, tick = 0, pending = 0, queue = Promise.resolve()
  try { cur = +localStorage.l } catch {}
  const el = (tag, props) => Object.assign(document.createElement(tag), props)

  const show = id => {
    cur = id
    try { localStorage.l = id } catch {}
    for (const [i, l] of lists) { l.tab.ariaCurrent = i == id; l.todo.classList.toggle('off', i != id); l.done.classList.toggle('off', i != id) }
    lb.hidden = lists.size < 2
    suggest()
  }

  const setLists = ls => {
    const ids = new Set(ls.map(l => l[0]))
    for (const [id, l] of lists) if (!ids.has(id)) { l.tab.remove(); l.todo.remove(); l.done.remove(); lists.delete(id) }
    for (const [id, name] of ls) if (!lists.has(id)) {
      const l = { tab: el('button', { textContent: name, onclick: () => show(id) }), todo: el('div', { className: 'todo' }), done: el('div', { className: 'done' }), items: new Map }
      nl.before(l.tab); board.append(l.todo, l.done); lists.set(id, l)
    }
    show(lists.has(cur) ? cur : ls[0][0])
  }

  const apply = (rows, full) => {
    if (full) for (const l of lists.values()) { l.items.clear(); l.todo.textContent = l.done.textContent = '' }
    for (const [lid, name, d] of rows) {
      const l = lists.get(lid)
      if (!l) continue
      const k = name.toLowerCase()
      let it = l.items.get(k)
      if (!it) l.items.set(k, it = { el: el('button', { textContent: name }) })
      it.done = d; it.t = ++tick
      it.el.ariaPressed = !!d
      ;(d ? l.done : l.todo).prepend(it.el)
    }
  }

  const post = async (path, body) => {
    for (;;) {
      try { const r = await fetch(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) }); if (r.status == 401) location.reload(); return r } catch {}
      await new Promise(r => setTimeout(r, 2000)) // offline / flaky network: retry until it lands
    }
  }

  const set = (name, d) => {
    const lid = cur
    apply([[lid, name, d]]); pending++
    queue = queue.then(() => post('/set', [lid, name, d])).finally(() => pending--)
  }

  const suggest = () => {
    const v = inp.value.trim().toLowerCase(), m = []
    if (v) for (const [k, it] of lists.get(cur)?.items || []) if (it.done && k.includes(v)) m.push([!k.startsWith(v), -it.t, it.el.textContent])
    m.sort((a, b) => a[0] - b[0] || a[1] - b[1])
    sug.replaceChildren(...m.slice(0, 8).map(x => el('button', { textContent: x[2] })))
  }

  const save = () => {
    if (pending) return // don't persist optimistic state the server hasn't seen
    const ls = [...lists].map(([id, l]) => [id, l.tab.textContent])
    const rows = [...lists].flatMap(([id, l]) => [...l.items.values()].map(it => [it.t, id, it.el.textContent, it.done]))
    try { localStorage.c2 = JSON.stringify([rev, ls, rows.sort((a, b) => a[0] - b[0]).map(r => r.slice(1))]) } catch {}
  }

  try { localStorage.removeItem('c') } catch {} // v1 cache format
  try { const [r, ls, rows] = JSON.parse(localStorage.c2); setLists(ls); apply(rows, 1); rev = r } catch {}

  const es = new EventSource('/events?since=' + rev)
  es.onmessage = e => { const [rows, full, ls] = JSON.parse(e.data); setLists(ls); apply(rows, full); rev = +e.lastEventId; suggest() }
  es.onerror = () => es.readyState == 2 && setTimeout(() => location.reload(), 2000)

  // braces, not `&&`: an on* handler returning false cancels the click
  board.onclick = e => { const b = e.target; if (b.parentNode.parentNode == board) set(b.textContent, b.ariaPressed == 'true' ? 0 : 1) }
  sug.onclick = e => { if (e.target == sug) return; set(e.target.textContent, 0); inp.value = ''; suggest(); inp.focus() }
  inp.oninput = suggest
  add.onsubmit = e => { e.preventDefault(); const v = inp.value.trim(); if (v) set(v, 0); inp.value = ''; suggest() }
  nl.onclick = async () => {
    const n = prompt('New list name')?.trim()
    if (!n) return
    const r = await post('/lists', [n])
    if (!r.ok) return alert(r.status == 409 ? 'List exists' : 'Failed')
    cur = +await r.text() // switches once the list arrives over the stream
    if (lists.has(cur)) show(cur)
  }
  lo.onsubmit = () => { try { localStorage.clear() } catch {} } // don't leave lists on a shared device
  lb.onclick = () => { if (confirm(`Delete list "${lists.get(cur).tab.textContent}" and all its items?`)) post('/lists/delete', [cur]) }
  const loadUsers = async () => {
    const [me, names] = await (await fetch('/users')).json()
    ul.replaceChildren(...names.map(n => {
      const li = document.createElement('li')
      li.textContent = n
      if (n == me) li.append(Object.assign(document.createElement('span'), { textContent: 'you' }))
      else li.append(Object.assign(document.createElement('button'), {
        title: 'Remove', ariaLabel: 'Remove ' + n, innerHTML: '<svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>',
        onclick: async () => { if (confirm(`Remove ${n}?`)) { await post('/users/delete', [n]); loadUsers() } }
      }))
      return li
    }))
  }
  ub.onclick = () => { users.showModal(); loadUsers() }
  // no `&&` shortcut here: an on* handler returning false cancels the click (that broke the Add button)
  users.onclick = e => { if (e.target == users) users.close() } // backdrop click
  add.onsubmit = e => { e.preventDefault(); const v = inp.value.trim(); if (v) set(v, 0); inp.value = ''; suggest() }
  nu.onsubmit = async e => {
    e.preventDefault()
    const r = await post('/users', [nu.u.value, nu.p.value])
    if (!r.ok) return alert(r.status == 409 ? 'User exists' : 'Failed')
    nu.reset(); loadUsers()
  }
  addEventListener('visibilitychange', () => document.hidden && save())
  addEventListener('pagehide', save)
} else try { localStorage.clear() } catch {}
</script>
